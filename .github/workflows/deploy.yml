name: Deploy (produkcja)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd /srv/services/kompetiq
            grep -qx 'WEB_PORT=8435' .env || { echo "Brak WEB_PORT=8435 w .env – zły katalog?"; exit 1; }

            git fetch origin main
            git reset --hard origin/main

            docker compose up --build -d

            # migrate, collectstatic, import modelu kompetencji i przebudowę bazy wiedzy wykonuje entrypoint.sh
